name: Azure App Service CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: nuts-complaints-analyzer  # Update this if your main branch uses a different App Service
  NODE_VERSION: '18.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --ignore-scripts
        env:
          CI: true
          GITHUB_ACTIONS: true

      - name: Build application
        run: pnpm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'http://localhost:7071' }}
          CI: true

      - name: Prepare deployment package
        run: |
          # Copy server files to dist directory
          cp server.js dist/
          cp package-server.json dist/package.json
          
          # Only copy web.config if deploying to Windows App Service
          # For Linux, skip web.config to avoid .NET detection
          # cp web.config dist/ 2>/dev/null || echo "web.config not found, skipping"
          
          # Install server dependencies in dist directory
          cd dist
          npm install --production --ignore-scripts
          
          # Verify express is installed
          if [ ! -d "node_modules/express" ]; then
            echo "ERROR: express not found in node_modules"
            ls -la node_modules/ | head -20
            exit 1
          fi
          echo "✓ Express installed successfully"
          cd ..
          
          # Create .deployment file for App Service to prevent .NET build
          echo '[config]' > dist/.deployment
          echo 'SCM_DO_BUILD_DURING_DEPLOYMENT=false' >> dist/.deployment
          # Don't run npm start during deployment - Azure will use the startup command from portal
          
          # Create .deploymentignore to prevent unwanted files
          echo '*.sln' > dist/.deploymentignore
          echo '*.csproj' >> dist/.deploymentignore
          echo '*.vbproj' >> dist/.deploymentignore
          
          # List contents to verify
          echo "Deployment package contents:"
          ls -la dist/ | head -20

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_9AE5400CFF7D4D7B8263D936E20393A4 }}
          package: ./dist

