name: Azure App Service CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: your-app-name    # Set this in GitHub Secrets
  NODE_VERSION: '18.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install
        env:
          CI: true

      - name: Build application
        run: pnpm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'http://localhost:7071' }}
          CI: true

      - name: Prepare deployment package
        run: |
          # Copy server files to dist directory
          cp server.js dist/
          cp package-server.json dist/package.json
          cp web.config dist/ 2>/dev/null || echo "web.config not found, skipping"
          
          # Create .deployment file for App Service
          echo '[config]' > dist/.deployment
          echo 'SCM_DO_BUILD_DURING_DEPLOYMENT=false' >> dist/.deployment

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./dist

